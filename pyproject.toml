[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fermix"
version = "0.1.0"
description = "Fast batched fp32 determinants and Pfaffians on GPU with JAX/Pallas kernels, with singular-safe gradients"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ao Chen" }]
keywords = ["jax", "pallas", "determinant", "pfaffian", "gpu", "variational monte carlo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Environment :: GPU :: NVIDIA CUDA",
]
# jax 0.7.1 is the first release exporting pallas.triton.load / .store, which the
# kernels use for masked access; older jax cannot run them.
dependencies = ["jax>=0.7.1", "numpy"]

[project.optional-dependencies]
test = ["pytest"]
# lrux is the Pfaffian reference benchmarks/bench.py compares against, and keeps
# pyright able to resolve that import (CI type-checks benchmarks/ too).
dev = ["pytest", "black", "pyright", "lrux"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
target-version = ["py311"]

[tool.pyright]
include = ["src/fermix", "tests", "benchmarks"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
